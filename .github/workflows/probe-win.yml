name: probe
on:
  push:
    branches: [chore/fleet-freeform-66]
jobs:
  p:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'lo.msi'
          Invoke-WebRequest -Uri https://downloadarchive.documentfoundation.org/libreoffice/old/26.2.5.2/win/x86_64/LibreOffice_26.2.5.2_Win_x86-64.msi -OutFile $msi
          Start-Process msiexec.exe -Wait -ArgumentList '/i', $msi, '/qn', '/norestart'
          $d = "$env:ProgramFiles\LibreOffice\program"
          Get-ChildItem $d -Filter soffice* | Select-Object Name
          foreach ($exe in 'soffice.exe','soffice.com') {
            $p = Start-Process -FilePath "$d\$exe" -ArgumentList '--version' -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\o-$exe.txt" -NoNewWindow
            $done = $p.WaitForExit(90000)
            "$exe exited=$done"
            Get-Content "$env:RUNNER_TEMP\o-$exe.txt" -ErrorAction SilentlyContinue
            if (-not $done) { Stop-Process -Id $p.Id -Force }
          }
          $p = Start-Process -FilePath "$d\soffice.exe" -ArgumentList '--headless','--convert-to','pdf','--outdir',"$env:RUNNER_TEMP\out","$PWD\examples\text-bullets.pptx" -PassThru -NoNewWindow
          "convert exited=$($p.WaitForExit(150000))"
          Get-ChildItem "$env:RUNNER_TEMP\out" -ErrorAction SilentlyContinue
  before:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup override set 1.97.0
          python -m pip install -r tests/visual/requirements.txt python-pptx==1.0.2
          cargo build --release --locked
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/libreoffice.tar.gz" https://downloadarchive.documentfoundation.org/libreoffice/old/26.2.5.2/deb/x86_64/LibreOffice_26.2.5.2_Linux_x86-64_deb.tar.gz
          mkdir "$RUNNER_TEMP/lo-debs" "$RUNNER_TEMP/lo"
          tar -xzf "$RUNNER_TEMP/libreoffice.tar.gz" -C "$RUNNER_TEMP/lo-debs"
          for deb in "$RUNNER_TEMP"/lo-debs/*/DEBS/*.deb; do dpkg -x "$deb" "$RUNNER_TEMP/lo"; done
          sudo apt-get update
          sudo apt-get install --yes libxinerama1 libcups2t64 libdbus-glib-1-2 libnss3 libgl1 libxrandr2 libxrender1 libxext6 libsm6 fontconfig
          export SOFFICE="$(find "$RUNNER_TEMP/lo" -name soffice -path '*/program/*' | head -n 1)"
          mkdir -p "$HOME/.fonts"
          for face in Regular Bold; do curl --fail --location -o "$HOME/.fonts/NotoSansCJKjp-$face.otf" "https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/Sans/OTF/Japanese/NotoSansCJKjp-$face.otf"; done
          fc-cache -f
          mkdir -p target/visual-tests
          python tests/visual/make_font_substitution.py target/visual-tests/font-substitution.pptx
          # Before: the macOS default table (Hiragino Sans is not installed here).
          python tests/visual/compare.py --binary target/release/pptx2img --fixture target/visual-tests/font-substitution.pptx --width 1600 --soffice "$SOFFICE" --out target/visual-tests/before || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: before-linux
          path: target/visual-tests/before
