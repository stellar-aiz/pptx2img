[package]
name = "pptx2img"
version = "0.1.0"
edition = "2024"
description = "CLI and Rust library for converting PPTX to PNG or PDF without Office (early implementation)"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
resvg = "0.48.1"
roxmltree = "0.21"
imagesize = "0.15"
png = "0.18"
skrifa = "0.44"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zune-jpeg = "0.5.9"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
